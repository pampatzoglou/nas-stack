  # ---------------------------------------------------------------------------
  # PhotoPrism
  # ---------------------------------------------------------------------------
  photoprism:
    image: photoprism/photoprism:261007@sha256:fc22e7f2ee9c82b6267531cf2336d1a3683ff7692989cdc0fd67b1336b2d0be5
    container_name: photoprism
    restart: unless-stopped
    stop_grace_period: 10s
    depends_on:
      photoprism-mariadb:
        condition: service_healthy
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    networks:
      - backend
    expose:
      - 2342
    secrets:
      - source: photoprism_admin_password
        target: /run/secrets/photoprism_admin_password
      - source: photoprism_mariadb_password
        target: /run/secrets/photoprism_mariadb_password
    environment:
      PHOTOPRISM_ADMIN_USER: "admin"
      PHOTOPRISM_ADMIN_PASSWORD_FILE: "/run/secrets/photoprism_admin_password"
      PHOTOPRISM_AUTH_MODE: "password"
      # TLS is terminated by Traefik; PhotoPrism serves plain HTTP internally
      PHOTOPRISM_DISABLE_TLS: "true"
      PHOTOPRISM_DEFAULT_TLS: "false"
      PHOTOPRISM_DEFAULT_LOCALE: "en"
      PHOTOPRISM_PLACES_LOCALE: "local"
      PHOTOPRISM_SITE_URL: "https://photoprism.xhaos.info/"
      PHOTOPRISM_SITE_TITLE: "PhotoPrism"
      PHOTOPRISM_SITE_CAPTION: "AI-Powered Photos App"
      PHOTOPRISM_LOG_LEVEL: "info"
      PHOTOPRISM_READONLY: "false"
      PHOTOPRISM_EXPERIMENTAL: "false"
      PHOTOPRISM_DISABLE_CHOWN: "false"
      PHOTOPRISM_DISABLE_WEBDAV: "false"
      PHOTOPRISM_DISABLE_SETTINGS: "false"
      PHOTOPRISM_DISABLE_TENSORFLOW: "false"
      PHOTOPRISM_DISABLE_FACES: "false"
      PHOTOPRISM_DISABLE_CLASSIFICATION: "false"
      PHOTOPRISM_DISABLE_VECTORS: "false"
      PHOTOPRISM_DISABLE_RAW: "false"
      PHOTOPRISM_RAW_PRESETS: "false"
      PHOTOPRISM_SIDECAR_YAML: "true"
      PHOTOPRISM_BACKUP_ALBUMS: "true"
      PHOTOPRISM_BACKUP_DATABASE: "true"
      PHOTOPRISM_BACKUP_SCHEDULE: "daily"
      PHOTOPRISM_INDEX_SCHEDULE: ""
      PHOTOPRISM_AUTO_INDEX: 300
      PHOTOPRISM_AUTO_IMPORT: -1
      PHOTOPRISM_DETECT_NSFW: "false"
      PHOTOPRISM_UPLOAD_NSFW: "true"
      PHOTOPRISM_UPLOAD_ARCHIVES: "true"
      PHOTOPRISM_UPLOAD_LIMIT: 5000
      PHOTOPRISM_ORIGINALS_LIMIT: 5000
      PHOTOPRISM_HTTP_COMPRESSION: "gzip"
      PHOTOPRISM_DATABASE_DRIVER: "mysql"
      PHOTOPRISM_DATABASE_SERVER: "photoprism-mariadb:3306"
      PHOTOPRISM_DATABASE_NAME: "photoprism"
      PHOTOPRISM_DATABASE_USER: "photoprism"
      PHOTOPRISM_DATABASE_PASSWORD_FILE: "/run/secrets/photoprism_mariadb_password"
      PHOTOPRISM_INIT: "tensorflow"
      PHOTOPRISM_VISION_API: "false"
    working_dir: "/photoprism"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - photoprism:/photoprism/storage
      - photos:/photoprism/originals
      - backup:/photoprism/storage/backups
    labels:
      - "com.docker.compose.service=photoprism"
      - "service.group=photos"
      - "service.name=photo-management"
      - "service.type=web"
      - "service.description=PhotoPrism - AI-Powered Photos App"
      - "service.port=2342"
      - "traefik.enable=true"
      - "traefik.http.routers.photoprism.rule=Host(`photoprism.xhaos.info`)"
      - "traefik.http.routers.photoprism.entrypoints=websecure"
      - "traefik.http.routers.photoprism.tls=true"
      - "traefik.http.routers.photoprism.tls.certresolver=letsencrypt"
      - "traefik.http.routers.photoprism.tls.domains[0].main=photoprism.xhaos.info"
      - "traefik.http.services.photoprism.loadbalancer.server.port=2342"
      - "traefik.http.routers.photoprism.middlewares=default-chain@docker"
    healthcheck:
      test: ["CMD", "photoprism", "status"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s

  photoprism-mariadb:
    image: mariadb:11.8.9@sha256:93fc3fe333b6cdfb061425869c2c3a5bb2851c0c74dbebc2c940f024e7482d76
    container_name: photoprism-mariadb
