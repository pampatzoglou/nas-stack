      device: /media/volumes/photoprism-mariadb
  syncthing:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /media/volumes/syncthing
  sync:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /media/sync
  duplicati:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /media/volumes/duplicati
  backup:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /backup
  bazarr:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /media/volumes/bazarr
  sonarr:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /media/volumes/sonarr
  radarr:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /media/volumes/radarr
  lidarr:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /media/volumes/lidarr
  prowlarr:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /media/volumes/prowlarr
  mylar3:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /media/volumes/mylar3
  jellyfin:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /media/volumes/jellyfin
  homeassistant:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /media/volumes/homeassistant
  freshrss:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /media/volumes/freshrss
  qbittorrent:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /media/volumes/qbittorrent
  nzbget:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /media/volumes/nzbget
  usenet:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /media/downloads/usenet
  calibre-web:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /media/volumes/calibre-web
  traefik:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /media/volumes/traefik
  adguard-work:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /media/volumes/adguard/work
  adguard-conf:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /media/volumes/adguard/conf
  pihole-etc:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /media/volumes/pihole/etc
