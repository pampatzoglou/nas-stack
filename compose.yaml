  # ---------------------------------------------------------------------------
  # Pi-hole - DNS and Ad Blocking
  # ---------------------------------------------------------------------------
  pihole:
    image: pihole/pihole:2026.09.0@sha256:bd3fc82ee1b1473a45fc074379dcd9fd7ce3e933809c44e10c0df9b22fd5de63
    container_name: pihole
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - SETFCAP
    # no-new-privileges is intentionally omitted: pihole-FTL uses setcap on its
    # own binary at startup and requires CAP_SETFCAP to be effective, which
    # no-new-privileges blocks even when the capability is granted.
    networks:
      - backend
    environment:
      - TZ=Europe/Athens
      - WEBPASSWORD=""
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - pihole-etc:/etc/pihole
      - pihole-dnsmasq:/etc/dnsmasq.d
    ports:
      - "5353:53/tcp"
      - "5353:53/udp"
    expose:
      - 53
      - 80
    labels:
      - "com.docker.compose.service=pihole"
      - "service.group=network"
      - "service.name=dns-ad-blocking"
      - "service.type=web"
      - "service.description=Pi-hole - DNS Sinkhole and Ad Blocker"
      - "service.port=80"
      - "traefik.enable=true"
      - "traefik.http.routers.pihole.rule=Host(`pihole.xhaos.info`)"
      - "traefik.http.routers.pihole.entrypoints=websecure"
      - "traefik.http.routers.pihole.tls=true"
      - "traefik.http.routers.pihole.tls.certresolver=letsencrypt"
      - "traefik.http.routers.pihole.tls.domains[0].main=pihole.xhaos.info"
      - "traefik.http.services.pihole.loadbalancer.server.port=80"
      - "traefik.http.routers.pihole.middlewares=default-chain@docker"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/admin/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Mosquitto - MQTT Broker
  # ---------------------------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2.0.22@sha256:cba7cd79d4e48b2e668b599c100bc5bb612a2c85aada76ab5a27987ecc81e3d7
    container_name: mosquitto
    user: "1883:1883"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto:/mosquitto/data
    ports:
      - "1883:1883"
    expose:
      - 1883
    labels:
      - "com.docker.compose.service=mosquitto"
      - "service.group=iot"
      - "service.name=mqtt-broker"
      - "service.description=Eclipse Mosquitto - MQTT Broker"
      - "service.port=1883"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h localhost -p 1883 -t '$$SYS/broker/version' -C 1 -W 3 || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
