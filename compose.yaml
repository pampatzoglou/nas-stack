# The NAS stack, deployed by doco-cd (.doco-cd.yml) as the compose project `nas`.
# Secrets are files on the host under /opt/secrets/nas-stack/ (see README.md), never in git.
# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  movies:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /media/movies
  series:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /media/series
  music:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /media/music
  books:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /media/books
  comics:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /media/comics
  photos:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /media/photos
  torrent:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /media/downloads/torrent
  torrent_tmp:
    driver: local
